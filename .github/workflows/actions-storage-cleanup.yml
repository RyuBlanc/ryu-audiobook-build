name: Actions Storage Cleanup

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ryu-audiobook-actions-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve all workflow-run and artifact evidence
        shell: bash
        run: |
          echo "Automatic workflow-run/artifact deletion is disabled."
          echo "Per-substage regression tests, failed-run diagnostics, checkpoint packages and SHA-256 manifests must remain available until the version 1.2.0 release is manually reviewed."
          echo "Re-enable retention only through a separately reviewed change after release acceptance."
