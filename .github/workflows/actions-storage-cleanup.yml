name: Actions Storage Cleanup

on:
  push:
    branches:
      - main
      - fix/premium-v2-live-voice-chapter-workflow
      - integration/stage3-feature-preservation
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ryu-audiobook-actions-cleanup
  cancel-in-progress: false

jobs:
  preserve:
    name: Preserve test and checkpoint evidence
    runs-on: ubuntu-latest
    steps:
      - name: Confirm automatic cleanup is disabled
        shell: bash
        run: |
          echo "Automatic workflow-run and artifact deletion is disabled."
          echo "Per-substage test runs, failed diagnostics, checkpoint installers, portable builds and SHA-256 manifests must remain available."
          echo "A retention policy may only be reintroduced after Version 1.2.0 acceptance and explicit user approval."
