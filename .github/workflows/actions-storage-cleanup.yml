name: Actions Storage Cleanup

on:
  push:
    branches:
      - main
      - fix/premium-v2-live-voice-chapter-workflow
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ryu-audiobook-actions-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup script
        uses: actions/checkout@v4
      - name: Prune stale workflow runs and attached storage
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_WORKFLOW_NAME: ${{ github.workflow }}
          PRUNE_CURRENT_WORKFLOW_TO_CURRENT: 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./.github/scripts/cleanup_actions_storage.ps1
