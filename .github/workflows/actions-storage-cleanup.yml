name: Actions Storage Cleanup

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ryu-audiobook-actions-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve build and test evidence
        shell: bash
        run: |
          echo "Automatic workflow-run/artifact deletion is disabled."
          echo "Preserve per-substage test logs, failed-run diagnostics, checkpoint packages and SHA-256 manifests until the release is manually reviewed."
          echo "Re-enable a reviewed retention policy only after Version 1.2.0 completion."
