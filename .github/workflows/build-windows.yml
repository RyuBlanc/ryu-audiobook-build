name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install core dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build application
        shell: pwsh
        run: python build.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\RyuAudiobook.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Ryu-Audiobook-Setup
          path: "installer-output/Ryu's Audiobook Setup.exe"
          if-no-files-found: error

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: Ryu-Audiobook-Windows-Portable
          path: "dist/Ryu's Audiobook/"
          if-no-files-found: error
