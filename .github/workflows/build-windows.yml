name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ryu-audiobook-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests
        shell: pwsh
        run: |
          git reset --hard HEAD
          git clean -ffdx
          $env:PYTHONPATH = (Get-Location).Path

          $workingHash = (git hash-object "app/chapters/characters.py").Trim()
          $gitHash = (git rev-parse "HEAD:app/chapters/characters.py").Trim()
          Write-Host "HEAD=$(git rev-parse HEAD)"
          Write-Host "WORKTREE CHARACTERS HASH=$workingHash"
          Write-Host "GIT OBJECT CHARACTERS HASH=$gitHash"
          if ($workingHash -ne $gitHash) {
            throw "Working-tree app/chapters/characters.py differs from the checked-out Git object."
          }

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue app\__pycache__, app\chapters\__pycache__, tests\__pycache__
          $env:PYTHONDONTWRITEBYTECODE = "1"
          python -c "from pathlib import Path; import os, inspect, app; p=Path('app/chapters/characters.py'); raw=p.read_text(encoding='utf-8'); print('FILE HAS DASH COMMENT=' + str('dash-only line' in raw)); import app.chapters.characters as m; print('TEST CWD=' + os.getcwd()); print('PYTHONPATH=' + os.environ.get('PYTHONPATH','')); print('APP MODULE=' + str(getattr(app,'__file__',None))); print('APP SPEC=' + str(app.__spec__)); print('CHARACTERS MODULE=' + m.__file__); print('CHARACTERS LOADER=' + str(m.__loader__)); print('CHARACTERS CACHED=' + str(getattr(m,'__cached__',None))); print('DASH PARSER=' + str('dash-only line' in inspect.getsource(m._all_dialogue_spans))); print('DIRECT FILE FUNCTION=' + str('dash-only line' in raw[raw.find('def _all_dialogue_spans'):raw.find('def _clean_name')]))"
          python -c "import sys; print(sys.executable)" | Set-Content -Encoding UTF8 (Join-Path $env:RUNNER_TEMP "ryu-python-path.txt")
          python -B -m unittest discover -s tests -v

      - name: Verify offline character Python bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "ryu-qwen-python-bootstrap"
          $installer = Join-Path $root "python-3.12.10-amd64.exe"
          $target = Join-Path $root "python312"
          $venv = Join-Path $root "runtime"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          curl.exe -L --fail --retry 3 -o $installer "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe"
          $arguments = @(
            "/quiet",
            "/passive",
            "InstallAllUsers=0",
            "Include_launcher=0",
            "Include_test=0",
            "PrependPath=0",
            "Shortcuts=0",
            "TargetDir=$target"
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Private Python installer failed with exit code $($process.ExitCode)."
          }

          $python = Join-Path $target "python.exe"
          if (-not (Test-Path $python)) {
            throw "Private Python executable was not installed."
          }

          & $python -c "import sys; assert sys.version_info[:2] == (3,12); print(sys.version)"
          & $python -m venv $venv
          $venvPython = Join-Path $venv "Scripts\python.exe"
          if (-not (Test-Path $venvPython)) {
            throw "Private Qwen venv was not created."
          }
          & $venvPython -m pip --version
          & $venvPython -m pip install --no-deps qwen-tts==0.1.1
          & $venvPython -c "import importlib.metadata as md; assert md.version('qwen-tts') == '0.1.1'; print('qwen_tts wheel bootstrap OK')"

      - name: Verify pinned Chatterbox Nano source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Get-Content "app\tts\chatterbox_runtime.py" -Raw
          $match = [regex]::Match($source, 'CHATTERBOX_SOURCE_REVISION\s*=\s*"([0-9a-f]{40})"')
          if (-not $match.Success) {
            throw "Pinned Chatterbox source revision was not found."
          }
          $revision = $match.Groups[1].Value
          $root = Join-Path $env:RUNNER_TEMP "ryu-chatterbox-source"
          $zip = Join-Path $root "chatterbox.zip"
          $extract = Join-Path $root "src"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          curl.exe -L --fail --retry 3 -o $zip "https://github.com/resemble-ai/chatterbox/archive/$revision.zip"
          Expand-Archive -Force $zip $extract
          $ttsTurbo = Get-ChildItem $extract -Recurse -Filter "tts_turbo.py" | Select-Object -First 1
          $nanoExample = Get-ChildItem $extract -Recurse -Filter "example_tts_nano.py" | Select-Object -First 1
          if (-not $ttsTurbo) { throw "Pinned Chatterbox source does not contain tts_turbo.py." }
          $ttsText = Get-Content $ttsTurbo.FullName -Raw
          if ($ttsText -notmatch 'def from_pretrained\(cls, device, nano=False\)') {
            throw "Pinned Chatterbox source does not expose Chatterbox-Nano through from_pretrained(..., nano=False)."
          }
          if (-not $nanoExample) { throw "Pinned Chatterbox source does not contain example_tts_nano.py." }
          Write-Host "Pinned Chatterbox source $revision exposes the Nano API."

      - name: Real Audiobook AI smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "ryu-ai-smoke"
          $bin = Join-Path $root "llama"
          $model = Join-Path $root "Qwen3-0.6B-Q5_K_M.gguf"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          $llamaZip = Join-Path $root "llama.zip"
          if (-not (Test-Path $bin)) {
            New-Item -ItemType Directory -Force -Path $bin | Out-Null
            curl.exe -L --fail --retry 3 -o $llamaZip "https://github.com/ggml-org/llama.cpp/releases/download/b11193/llama-b11193-bin-win-cpu-x64.zip"
            Expand-Archive -Force $llamaZip $bin
          }
          $server = Get-ChildItem $bin -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe was not found in the smoke-test runtime." }

          if (-not (Test-Path $model)) {
            curl.exe -L --fail --retry 3 -o "$model.part" "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/ef4088322893040952513f532f736ddeab518403/Qwen3-0.6B-Q5_K_M.gguf?download=true"
            Move-Item -Force "$model.part" $model
          }

          $stdoutLog = Join-Path $root "llama.stdout.log"
          $stderrLog = Join-Path $root "llama.stderr.log"
          $proc = Start-Process -FilePath $server.FullName -ArgumentList @(
            "-m", $model,
            "--host", "127.0.0.1",
            "--port", "18765",
            "--ctx-size", "4096",
            "--threads", "4",
            "--no-webui",
            "--reasoning", "off",
            "--reasoning-format", "none"
          ) -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -PassThru -WindowStyle Hidden

          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              if ($proc.HasExited) {
                Write-Host "===== llama stdout ====="
                if (Test-Path $stdoutLog) { Get-Content $stdoutLog -Tail 200 }
                Write-Host "===== llama stderr ====="
                if (Test-Path $stderrLog) { Get-Content $stderrLog -Tail 200 }
                throw "llama-server exited before becoming ready. Logs: $stdoutLog / $stderrLog"
              }
              try {
                $health = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18765/health" -TimeoutSec 2
                if ($health.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "llama-server did not become ready within 120 seconds." }

            $body = @{
              messages = @(
                @{ role = "system"; content = "You are the Ryu's Audiobook AI self-test. Return only one valid JSON object. Do not think. Do not use markdown." },
                @{ role = "user"; content = '/no_think Return {"ok":true,"message":"ready"}. Do not add any other text.' }
              )
              temperature = 0.2
              top_p = 0.8
              max_tokens = 80
              stream = $false
            } | ConvertTo-Json -Depth 20

            $response = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:18765/v1/chat/completions" -ContentType "application/json" -Body $body
            $content = [string]$response.choices[0].message.content
            Write-Host "Audiobook AI raw self-test response:"
            Write-Host $content
            # Match the application parser: ignore an optional reasoning block
            # or markdown fence and validate the JSON object itself.
            $clean = $content -replace '(?s)<think>.*?</think>', ''
            $clean = $clean -replace '^\s*```(?:json)?\s*', ''
            $clean = $clean -replace '\s*```\s*$', ''
            $start = $clean.IndexOf('{')
            $end = $clean.LastIndexOf('}')
            if ($start -lt 0 -or $end -le $start) {
              throw "Audiobook AI returned no JSON object: $content"
            }
            $jsonText = $clean.Substring($start, $end - $start + 1)
            $obj = $jsonText | ConvertFrom-Json
            if (-not $obj.ok -or $obj.message -ne 'ready') {
              throw "Audiobook AI returned unexpected self-test JSON: $content"
            }
            Write-Host "Real Audiobook AI smoke test PASSED."

            $env:RYU_AI_SERVER_URL = "http://127.0.0.1:18765"
            $env:PYTHONPATH = (Get-Location).Path
            $pythonPathFile = Join-Path $env:RUNNER_TEMP "ryu-python-path.txt"
            if (-not (Test-Path -LiteralPath $pythonPathFile -PathType Leaf)) {
              throw "The regression test did not leave the Python interpreter path for the live AI smoke test."
            }
            $pythonExe = (Get-Content -LiteralPath $pythonPathFile -Raw).Trim()
            Write-Host "Resolved Python executable from regression step: $pythonExe"
            if (-not (Test-Path -LiteralPath $pythonExe -PathType Leaf)) {
              throw "The Python interpreter recorded by the regression step is no longer available: $pythonExe"
            }
            & $pythonExe -c "import sys; print('Python executable:', sys.executable)"
            if ($LASTEXITCODE -ne 0) {
              throw "The recorded Python interpreter could not be executed."
            }
            & $pythonExe -B tests/smoke_audiobook_ai_live.py
            if ($LASTEXITCODE -ne 0) {
              throw "The full Audiobook AI brain integration test failed with exit code $LASTEXITCODE."
            }
            Write-Host "Full Audiobook AI brain smoke test PASSED."
          }
          finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Download built-in offline neural voices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bundled_models\piper" | Out-Null
          python -m piper.download_voices --data-dir "bundled_models\piper" en_US-amy-medium en_US-lessac-medium
          $models = Get-ChildItem "bundled_models\piper\*.onnx"
          if ($models.Count -lt 2) {
            throw "Expected at least two bundled Piper voice models, found $($models.Count)."
          }
          Get-ChildItem "bundled_models\piper" | Select-Object Name,Length
      
      - name: Download built-in offline natural voices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bundled_models\kokoro" | Out-Null
          $modelUrl = "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx"
          $voicesUrl = "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin"
          curl.exe -L --fail --retry 3 -o "bundled_models\kokoro\kokoro-v1.0.fp16.onnx" $modelUrl
          curl.exe -L --fail --retry 3 -o "bundled_models\kokoro\voices-v1.0.bin" $voicesUrl
          $model = Get-Item "bundled_models\kokoro\kokoro-v1.0.fp16.onnx"
          $voices = Get-Item "bundled_models\kokoro\voices-v1.0.bin"
          if ($model.Length -lt 100MB) { throw "Kokoro Natural FP16 model download is unexpectedly small: $($model.Length) bytes" }
          if ($voices.Length -lt 10MB) { throw "Kokoro Natural voice pack download is unexpectedly small: $($voices.Length) bytes" }
          Write-Host "Kokoro model: $($model.Name) $($model.Length) bytes"
          Write-Host "Kokoro voices: $($voices.Name) $($voices.Length) bytes"


      - name: Verify application version
        shell: pwsh
        env:
          RYU_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          $version = python -c "from app.version import full_version; print(full_version())"
          Write-Host "Application version: $version"
          $expected = "v0.3.7"
          if (-not $version.StartsWith($expected) -or -not $version.EndsWith("Build $env:RYU_BUILD_NUMBER")) {
            throw "Unexpected application version: $version"
          }

      - name: Build application
        shell: pwsh
        env:
          RYU_BUILD_NUMBER: ${{ github.run_number }}
        run: python build.py

      - name: Verify bundled offline voices
        shell: pwsh
        run: |
          $exe = "dist\Ryu's Audiobook\Ryu's Audiobook.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }
          $models = Get-ChildItem "dist\Ryu's Audiobook\_internal\bundled_models\piper\*.onnx"
          if ($models.Count -lt 2) {
            throw "The frozen application does not contain the offline neural voice pack."
          }
          $kokoroModels = Get-ChildItem "dist\Ryu's Audiobook\_internal\bundled_models\kokoro\*.onnx"
          $kokoroVoices = "dist\Ryu's Audiobook\_internal\bundled_models\kokoro\voices-v1.0.bin"
          if ($kokoroModels.Count -lt 1 -or -not (Test-Path $kokoroVoices)) {
            throw "The frozen application does not contain the offline natural Kokoro voice pack."
          }

      - name: Verify bundled UI modules
        shell: pwsh
        run: |
          $required = @(
            "app.ui.voice_page",
            "app.ui.voice_cast_page",
            "app.ui.generation_page",
            "app.ui.chapter_editor",
            "app.ui.import_page",
            "app.ui.library",
            "app.ui.hardware_page",
            "app.ui.models_page",
            "app.tts.cast_provider",
            "app.tts.chatterbox_runtime"
          )
          foreach ($module in $required) {
            $relative = $module.Replace(".", "\") + ".py"
            $path = "dist\Ryu's Audiobook\_internal\$relative"
            if (-not (Test-Path $path)) {
              throw "Required bundled source is missing: $path"
            }
          }

      - name: Verify application executable file version
        shell: pwsh
        env:
          RYU_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $exe = "dist\Ryu's Audiobook\Ryu's Audiobook.exe"
          $expected = "0.3.7.$env:RYU_BUILD_NUMBER"
          $info = (Get-Item $exe).VersionInfo
          Write-Host "EXE FileVersion: $($info.FileVersion)"
          Write-Host "EXE ProductVersion: $($info.ProductVersion)"
          if ($info.FileVersion -ne $expected) {
            throw "EXE FileVersion is '$($info.FileVersion)', expected '$expected'"
          }
          if ($info.ProductVersion -ne $expected) {
            throw "EXE ProductVersion is '$($info.ProductVersion)', expected '$expected'"
          }

      - name: Verify frozen Python archive contains critical modules
        shell: pwsh
        run: |
          $exe = "dist\Ryu's Audiobook\Ryu's Audiobook.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }
          $archive = & pyi-archive_viewer --list --recursive "$exe" 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the frozen PyInstaller archive."
          }
          $required = @(
            "app.tts.chatterbox_runtime",
            "app.tts.providers.chatterbox",
            "app.ui.voice_page"
          )
          foreach ($module in $required) {
            if (-not ($archive | Select-String -SimpleMatch $module)) {
              throw "Critical frozen Python module is missing from the executable archive: $module"
            }
          }

      - name: Smoke-test frozen executable startup
        shell: pwsh
        run: |
          $exe = "dist\Ryu's Audiobook\Ryu's Audiobook.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            throw "Frozen application exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\RyuAudiobook.iss"
          $installer = "installer\installer-output\Ryu's Audiobook Setup.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer was not produced: $installer"
          }
          $size = (Get-Item $installer).Length
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          Write-Host "Installer size: $size bytes"
          Write-Host "Installer SHA256: $hash"
          $expectedVersion = "0.3.7.${{ github.run_number }}"
          $info = (Get-Item $installer).VersionInfo
          $actualFileVersion = ([string]$info.FileVersion).Trim()
          $actualProductVersion = ([string]$info.ProductVersion).Trim()
          Write-Host "Installer ProductVersion: $($info.ProductVersion)"
          if ($actualFileVersion -ne $expectedVersion) {
            throw "Installer FileVersion is '$actualFileVersion', expected '$expectedVersion'"
          }
          if ($actualProductVersion -ne $expectedVersion) {
            throw "Installer ProductVersion is '$actualProductVersion', expected '$expectedVersion'"
          }

      - name: Publish Windows installer as GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "build-${{ github.run_number }}"
          $installer = "installer\installer-output\Ryu's Audiobook Setup.exe"
          $title = "Ryu's Audiobook Build #${{ github.run_number }}"
          $notes = @"
          Automated Windows installer for Ryu's Audiobook.

          Commit: ${{ github.sha }}
          Build: #${{ github.run_number }}
          Version: v0.3.7
          This is a prerelease build for testing.
          "@

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --repo $repo --clobber
          } else {
            gh release create $tag $installer --repo $repo --title $title --notes $notes --prerelease --target "${{ github.sha }}"
          }

          Write-Host "Published installer to GitHub Release: $tag"

      - name: Clean old workflow artifacts
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $response = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$repo/actions/artifacts?per_page=100" -Headers $headers
          foreach ($artifact in @($response.artifacts)) {
            Write-Host "Deleting old workflow artifact $($artifact.name) ($($artifact.id))"
            try {
              Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$repo/actions/artifacts/$($artifact.id)" -Headers $headers
            } catch {
              Write-Warning "Could not delete artifact $($artifact.id): $($_.Exception.Message)"
            }
          }

      - name: Clean old workflow runs
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $response = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$repo/actions/runs?branch=main&per_page=100" -Headers $headers
          $runsToKeep = 15
          $completedRuns = @($response.workflow_runs | Where-Object { $_.status -eq "completed" })

          if ($completedRuns.Count -gt $runsToKeep) {
            $completedRuns | Select-Object -Skip $runsToKeep | ForEach-Object {
              Write-Host "Deleting old workflow run #$($_.run_number) ($($_.id))"
              Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$repo/actions/runs/$($_.id)" -Headers $headers
            }
          }

          Write-Host "Kept the newest $runsToKeep completed workflow runs."
