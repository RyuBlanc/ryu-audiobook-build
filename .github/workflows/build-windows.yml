name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install core dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build application
        shell: pwsh
        run: python build.py

      - name: Verify bundled UI modules
        shell: pwsh
        run: |
          $exe = "dist\Ryu's Audiobook\Ryu's Audiobook.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }

          $listing = & pyi-archive_viewer $exe --list 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the PyInstaller executable archive."
          }

          $required = @(
            "app.ui.voice_page",
            "app.ui.generation_page",
            "app.ui.chapter_editor",
            "app.ui.import_page",
            "app.ui.library",
            "app.ui.hardware_page",
            "app.ui.models_page"
          )

          foreach ($module in $required) {
            if ($listing -notmatch [regex]::Escape($module)) {
              throw "Required module is missing from the frozen executable: $module"
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\RyuAudiobook.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Ryu-Audiobook-Setup-${{ github.sha }}
          path: "installer/installer-output/Ryu's Audiobook Setup.exe"
          if-no-files-found: error

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: Ryu-Audiobook-Windows-Portable-${{ github.sha }}
          path: "dist/Ryu's Audiobook/"
          if-no-files-found: error
