name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ryu-audiobook-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests
        shell: pwsh
        run: |
          git reset --hard HEAD
          git clean -ffdx
          $env:PYTHONPATH = (Get-Location).Path

          $workingHash = (git hash-object "app/chapters/characters.py").Trim()
          $gitHash = (git rev-parse "HEAD:app/chapters/characters.py").Trim()
          Write-Host "HEAD=$(git rev-parse HEAD)"
          Write-Host "WORKTREE CHARACTERS HASH=$workingHash"
          Write-Host "GIT OBJECT CHARACTERS HASH=$gitHash"
          if ($workingHash -ne $gitHash) {
            throw "Working-tree app/chapters/characters.py differs from the checked-out Git object."
          }

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue app\__pycache__, app\chapters\__pycache__, tests\__pycache__
          $env:PYTHONDONTWRITEBYTECODE = "1"
          python -c "from pathlib import Path; import os, inspect, app; p=Path('app/chapters/characters.py'); raw=p.read_text(encoding='utf-8'); print('FILE HAS DASH COMMENT=' + str('dash-only line' in raw)); import app.chapters.characters as m; print('TEST CWD=' + os.getcwd()); print('PYTHONPATH=' + os.environ.get('PYTHONPATH','')); print('APP MODULE=' + str(getattr(app,'__file__',None))); print('APP SPEC=' + str(app.__spec__)); print('CHARACTERS MODULE=' + m.__file__); print('CHARACTERS LOADER=' + str(m.__loader__)); print('CHARACTERS CACHED=' + str(getattr(m,'__cached__',None))); print('DASH PARSER=' + str('dash-only line' in inspect.getsource(m._all_dialogue_spans))); print('DIRECT FILE FUNCTION=' + str('dash-only line' in raw[raw.find('def _all_dialogue_spans'):raw.find('def _clean_name')]))"
          python -B -m unittest discover -s tests -v

      - name: Download built-in offline neural voices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bundled_models\piper" | Out-Null
          python -m piper.download_voices --data-dir "bundled_models\piper" en_US-amy-medium en_US-lessac-medium
          $models = Get-ChildItem "bundled_models\piper\*.onnx"
          if ($models.Count -lt 2) {
            throw "Expected at least two bundled Piper voice models, found $($models.Count)."
          }
          Get-ChildItem "bundled_models\piper" | Select-Object Name,Length

      - name: Build application
        shell: pwsh
        env:
          RYU_BUILD_NUMBER: ${{ github.run_number }}
        run: python build.py

      - name: Verify bundled offline voices
        shell: pwsh
        run: |
          $exe = "dist\Ryu's Audiobook\Ryu's Audiobook.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }
          $models = Get-ChildItem "dist\Ryu's Audiobook\_internal\bundled_models\piper\*.onnx"
          if ($models.Count -lt 2) {
            throw "The frozen application does not contain the offline neural voice pack."
          }

      - name: Verify bundled UI modules
        shell: pwsh
        run: |
          $required = @(
            "app.ui.voice_page",
            "app.ui.voice_cast_page",
            "app.ui.generation_page",
            "app.ui.chapter_editor",
            "app.ui.import_page",
            "app.ui.library",
            "app.ui.hardware_page",
            "app.ui.models_page",
            "app.tts.cast_provider",
            "app.tts.chatterbox_runtime"
          )
          foreach ($module in $required) {
            $relative = $module.Replace(".", "\") + ".py"
            $path = "dist\Ryu's Audiobook\_internal\$relative"
            if (-not (Test-Path $path)) {
              throw "Required bundled source is missing: $path"
            }
          }

      - name: Verify frozen Python archive contains critical modules
        shell: pwsh
        run: |
          $exe = "dist\Ryu's Audiobook\Ryu's Audiobook.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }
          $archive = & pyi-archive_viewer --list --recursive "$exe" 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the frozen PyInstaller archive."
          }
          $required = @(
            "app.tts.chatterbox_runtime",
            "app.tts.providers.chatterbox",
            "app.ui.voice_page"
          )
          foreach ($module in $required) {
            if (-not ($archive | Select-String -SimpleMatch $module)) {
              throw "Critical frozen Python module is missing from the executable archive: $module"
            }
          }

      - name: Smoke-test frozen executable startup
        shell: pwsh
        run: |
          $exe = "dist\Ryu's Audiobook\Ryu's Audiobook.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            throw "Frozen application exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\RyuAudiobook.iss"
          $installer = "installer\installer-output\Ryu's Audiobook Setup.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer was not produced: $installer"
          }
          $size = (Get-Item $installer).Length
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          Write-Host "Installer size: $size bytes"
          Write-Host "Installer SHA256: $hash"

      - name: Publish Windows installer as GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "build-${{ github.run_number }}"
          $installer = "installer\installer-output\Ryu's Audiobook Setup.exe"
          $title = "Ryu's Audiobook Build #${{ github.run_number }}"
          $notes = @"
          Automated Windows installer for Ryu's Audiobook.

          Commit: ${{ github.sha }}
          Build: #${{ github.run_number }}
          This is a prerelease build for testing.
          "@

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --repo $repo --clobber
          } else {
            gh release create $tag $installer --repo $repo --title $title --notes $notes --prerelease --target "${{ github.sha }}"
          }

          Write-Host "Published installer to GitHub Release: $tag"

      - name: Clean old workflow artifacts
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $response = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$repo/actions/artifacts?per_page=100" -Headers $headers
          foreach ($artifact in @($response.artifacts)) {
            Write-Host "Deleting old workflow artifact $($artifact.name) ($($artifact.id))"
            try {
              Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$repo/actions/artifacts/$($artifact.id)" -Headers $headers
            } catch {
              Write-Warning "Could not delete artifact $($artifact.id): $($_.Exception.Message)"
            }
          }

      - name: Clean old workflow runs
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $response = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$repo/actions/runs?branch=main&per_page=100" -Headers $headers
          $runsToKeep = 15
          $completedRuns = @($response.workflow_runs | Where-Object { $_.status -eq "completed" })

          if ($completedRuns.Count -gt $runsToKeep) {
            $completedRuns | Select-Object -Skip $runsToKeep | ForEach-Object {
              Write-Host "Deleting old workflow run #$($_.run_number) ($($_.id))"
              Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$repo/actions/runs/$($_.id)" -Headers $headers
            }
          }

          Write-Host "Kept the newest $runsToKeep completed workflow runs."
