name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install core dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build application
        shell: pwsh
        run: python build.py

      - name: Verify bundled UI modules
        shell: pwsh
        run: |
          $exe = "dist\Ryu's Audiobook\Ryu's Audiobook.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }

          # Verify the source-form fallback produced by the dedicated UI hook.
          $voiceSource = "dist\Ryu's Audiobook\_internal\app\ui\voice_page.py"
          if (-not (Test-Path $voiceSource)) {
            throw "Required bundled UI source is missing: $voiceSource"
          }

          $required = @(
            "app.ui.voice_page",
            "app.ui.generation_page",
            "app.ui.chapter_editor",
            "app.ui.import_page",
            "app.ui.library",
            "app.ui.hardware_page",
            "app.ui.models_page"
          )

          foreach ($module in $required) {
            $relative = $module.Replace(".", "\") + ".py"
            $path = "dist\Ryu's Audiobook\_internal\$relative"
            if (-not (Test-Path $path)) {
              throw "Required bundled UI source is missing: $path"
            }
          }

          # Smoke-test the actual frozen executable. If an import error occurs,
          # the process exits immediately with a non-zero code. A healthy GUI
          # remains running, so terminate it after a short startup window.
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            if ($process.ExitCode -ne 0) {
              throw "Frozen application exited during startup with code $($process.ExitCode)."
            }
            throw "Frozen application exited unexpectedly during startup."
          }
          Stop-Process -Id $process.Id -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\RyuAudiobook.iss"

      - name: Clean up old Ryu Audiobook artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifacts = gh api --paginate "/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .name] | @tsv'
          foreach ($line in $artifacts) {
            $parts = $line -split [char]9, 2
            if ($parts.Count -eq 2 -and $parts[1] -like "Ryu-Audiobook-*") {
              Write-Host "Deleting old Ryu Audiobook artifact: $($parts[1]) ($($parts[0]))"
              gh api --method DELETE "/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($parts[0])"
            }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Ryu-Audiobook-Setup-${{ github.sha }}
          path: "installer/installer-output/Ryu's Audiobook Setup.exe"
          if-no-files-found: error
          retention-days: 1
