name: Provider Functional Smoke

on:
  push:
    branches: [main, stage-3/restart-from-stage2-closeout-1794]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ryu-audiobook-provider-functional
  cancel-in-progress: true

jobs:
  piper-edge:
    name: Piper offline + Edge online synthesis
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download Piper voice
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bundled_models\piper" | Out-Null
          python -m piper.download_voices --data-dir "bundled_models\piper" en_US-lessac-medium
          python -m piper.download_voices --data-dir "bundled_models\piper" en_US-amy-medium
          python -m piper.download_voices --data-dir "bundled_models\piper" en_US-ryan-high
          foreach ($voice in @("en_US-lessac-medium", "en_US-amy-medium", "en_US-ryan-high")) {
            if (-not (Test-Path "bundled_models\piper\$voice.onnx")) { throw "Required Piper model was not downloaded: $voice" }
            if (-not (Test-Path "bundled_models\piper\$voice.onnx.json")) { throw "Required Piper model config was not downloaded: $voice" }
          }

      - name: Run Piper and Edge synthesis
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONWARNINGS: ignore
        run: python -B tests/smoke_piper_edge.py

      - name: Run real Stage 3 Voice Studio preview and multi-chapter audiobook acceptance
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONWARNINGS: ignore
        run: python -B tests/smoke_stage3_real_multichapter.py

  chatterbox:
    name: Chatterbox Nano real synthesis
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chatterbox dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --upgrade -r requirements-voice-cloning.txt
          $perthRevision = 'ff1c8ac55a976971245cdd53c18d6131ca00d993'
          $perthRoot = Join-Path $env:RUNNER_TEMP "ryu-perth-functional"
          $perthZip = Join-Path $perthRoot "perth.zip"
          $perthExtract = Join-Path $perthRoot "src"
          New-Item -ItemType Directory -Force -Path $perthRoot | Out-Null
          curl.exe -L --fail --retry 3 -o $perthZip "https://github.com/resemble-ai/Perth/archive/$perthRevision.zip"
          Expand-Archive -Force $perthZip $perthExtract
          $perthSource = Get-ChildItem $perthExtract -Recurse -Filter "pyproject.toml" | Where-Object { $_.FullName -match "Perth-" } | Select-Object -First 1
          if (-not $perthSource) { throw "Pinned Perth source was not found." }
          python -m pip install --no-cache-dir --no-deps $perthSource.Directory.FullName
          python -c "import perth; print(perth.__file__); assert getattr(perth,'PerthImplicitWatermarker',None) is not None or getattr(perth,'DummyWatermarker',None) is not None"
          $root = Join-Path $env:RUNNER_TEMP "ryu-chatterbox-functional"
          $zip = Join-Path $root "chatterbox.zip"
          $extract = Join-Path $root "src"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $revision = '5de7a54aa4e5e2baadb0182dde554908b48b85c2'
          curl.exe -L --fail --retry 3 -o $zip "https://github.com/resemble-ai/chatterbox/archive/$revision.zip"
          Expand-Archive -Force $zip $extract
          $source = Get-ChildItem $extract -Recurse -Filter "tts_turbo.py" | Select-Object -First 1
          if (-not $source) { throw "Pinned Chatterbox source is missing tts_turbo.py." }
          python -m pip install --no-cache-dir --no-deps (Get-ChildItem $extract -Directory | Select-Object -First 1).FullName

      - name: Run real Chatterbox Nano synthesis
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
          HF_HOME: ${{ runner.temp }}\ryu-hf
          PYTHONWARNINGS: ignore
        run: python -B tests/smoke_chatterbox_runtime.py
