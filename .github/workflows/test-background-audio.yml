name: Background Audio Regression Tests

on:
  push:
    branches: [feature/background-audio-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: background-audio-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run regression tests
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m unittest discover -s tests -v
