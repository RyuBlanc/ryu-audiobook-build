name: Provider Runtime Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ryu-audiobook-provider-smoke
  cancel-in-progress: true

jobs:
  kokoro:
    name: Kokoro real synthesis
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download Kokoro assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bundled_models\kokoro" | Out-Null
          curl.exe -L --fail --retry 3 -o "bundled_models\kokoro\kokoro-v1.0.fp16.onnx" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx"
          curl.exe -L --fail --retry 3 -o "bundled_models\kokoro\voices-v1.0.bin" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin"
          if ((Get-Item "bundled_models\kokoro\kokoro-v1.0.fp16.onnx").Length -lt 100MB) { throw "Kokoro model is unexpectedly small." }
          if ((Get-Item "bundled_models\kokoro\voices-v1.0.bin").Length -lt 10MB) { throw "Kokoro voice pack is unexpectedly small." }

      - name: Run real Kokoro synthesis
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONWARNINGS: ignore
        run: python -B tests/smoke_kokoro_runtime.py

  chatterbox-api:
    name: Chatterbox pinned API
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify and install pinned Chatterbox source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $revision = '5de7a54aa4e5e2baadb0182dde554908b48b85c2'
          $root = Join-Path $env:RUNNER_TEMP "ryu-chatterbox-api"
          $zip = Join-Path $root "chatterbox.zip"
          $extract = Join-Path $root "src"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          curl.exe -L --fail --retry 3 -o $zip "https://github.com/resemble-ai/chatterbox/archive/$revision.zip"
          Expand-Archive -Force $zip $extract
          $source = Get-ChildItem $extract -Recurse -Filter "tts_turbo.py" | Select-Object -First 1
          if (-not $source) { throw "Pinned Chatterbox source is missing tts_turbo.py." }
          $text = Get-Content $source.FullName -Raw
          if ($text -notmatch 'def from_pretrained\(cls, device, nano=False\)') { throw "Pinned Chatterbox source does not expose nano API." }
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --upgrade --force-reinstall -r requirements-voice-cloning.txt
          python -m pip install --no-cache-dir --no-deps (Get-ChildItem $extract -Directory | Select-Object -First 1).FullName

      - name: Import actual Chatterbox Nano API
        shell: pwsh
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}"
          python -c "import inspect; from chatterbox.tts_turbo import ChatterboxTurboTTS; sig=inspect.signature(ChatterboxTurboTTS.from_pretrained); print(sig); assert 'nano' in sig.parameters"
          Write-Host "Pinned Chatterbox Nano API import smoke test PASSED."
